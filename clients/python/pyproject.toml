[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engram-client"
version = "0.8.1"
description = "Zero-dependency Python client SDK for Engram cognitive memory engines."
license = { text = "MIT" }
requires-python = ">=3.9"
readme = "README.md"
authors = [
    { name = "Unbound Cognition" },
]
keywords = ["memory", "ai", "agents", "client", "sdk", "engram", "cognitive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Unbound-Cognition/engram"
Documentation = "https://engram-memory.dev"
Repository = "https://github.com/Unbound-Cognition/engram"
Issues = "https://github.com/Unbound-Cognition/engram/issues"
